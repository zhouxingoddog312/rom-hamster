# rom-hamster 内置平台规则库
# 随软件包升级覆盖；个人自定义请写入 ~/.rom-hamster.conf

[platform_extensions]
nes:.nes;.unf;.fds;compress_supported=true;recommended_format=zip;arcade=false;patch_formats=.ips;.bps;.ups;ambiguous_formats=;aliases=nintendo,nes,familycomputer,famicom
snes:.sfc;.smc;.fig;compress_supported=true;recommended_format=zip;arcade=false;patch_formats=.ips;.bps;.ups;ambiguous_formats=;aliases=superfamicom,supernintendo,snes
n64:.n64;.z64;.v64;compress_supported=true;recommended_format=zip;arcade=false;patch_formats=.bps;.xdelta;ambiguous_formats=;aliases=nintendo64,n64
gb:.gb;.sgb;compress_supported=true;recommended_format=zip;arcade=false;patch_formats=.ips;.bps;ambiguous_formats=;aliases=gameboy,nintendogameboy
gbc:.gbc;compress_supported=true;recommended_format=zip;arcade=false;patch_formats=.ips;.bps;ambiguous_formats=;aliases=gameboycolor,gameboycolour
gba:.gba;compress_supported=true;recommended_format=zip;arcade=false;patch_formats=.ips;.bps;.ups;ambiguous_formats=;aliases=gameboyadvance,advance
ngp:.ngp;.ngc;compress_supported=true;recommended_format=zip;arcade=false;patch_formats=.bps;.ups;ambiguous_formats=;aliases=neogeopocket,ngp
ngpc:.ngpc;compress_supported=true;recommended_format=zip;arcade=false;patch_formats=.bps;.ups;ambiguous_formats=;aliases=neogeopocketcolor,ngpc
wswan:.ws;.wsc;compress_supported=true;recommended_format=zip;arcade=false;patch_formats=.bps;.ups;ambiguous_formats=;aliases=wonderswan,ws
pcengine:.pce;.tg16;compress_supported=true;recommended_format=zip;arcade=false;patch_formats=.bps;.xdelta;ambiguous_formats=;aliases=pcengine,nec,pcengine
ngcd:.cue;.ccd;.img;.iso;compress_supported=false;recommended_format=chd;arcade=false;patch_formats=.ppf;.xdelta;ambiguous_formats=;aliases=neogeocd,ngcd
megadrive:.gen;.md;.smd;.32x;compress_supported=true;recommended_format=zip;arcade=false;patch_formats=.ips;.bps;ambiguous_formats=;aliases=genesis,megadrive,segamegadrive
segacd:.cue;.ccd;.img;.iso;compress_supported=false;recommended_format=chd;arcade=false;patch_formats=.ppf;ambiguous_formats=;aliases=segamegadrivecd,segacd,megacd
saturn:.cue;.ccd;.img;.iso;.mdf;compress_supported=false;recommended_format=chd;arcade=false;patch_formats=.xdelta;.ppf;ambiguous_formats=;aliases=segasaturn,saturn
dreamcast:.gdi;.cdi;.cue;.bin;.mdf;compress_supported=false;recommended_format=chd;arcade=false;patch_formats=.xdelta;.ppf;ambiguous_formats=;aliases=sega,dreamcast
psx:.cue;.bin;.img;.ccd;.mdf;.pbp;compress_supported=false;recommended_format=chd;arcade=false;patch_formats=.ppf;.xdelta;ambiguous_formats=;aliases=playstation,playstation1,ps1,sonyplaystation
ps2:.iso;.cso;.ima;compress_supported=false;recommended_format=raw;arcade=false;patch_formats=.xdelta;.ppf;ambiguous_formats=;aliases=playstation2,ps2,sonyplaystation2
psp:.iso;.cso;compress_supported=false;recommended_format=cso;arcade=false;patch_formats=.pkg;ambiguous_formats=.pkg;aliases=playstationportable,psp
ps3:.iso;.pkg;compress_supported=false;recommended_format=raw;arcade=false;patch_formats=.pkg;ambiguous_formats=.pkg;aliases=playstation3,ps3,sonyplaystation3
psvita:.vpk;compress_supported=false;recommended_format=raw;arcade=false;patch_formats=.vpk;ambiguous_formats=.vpk;aliases=psvita,playstationvita
gc:.iso;.gcm;.rvz;compress_supported=false;recommended_format=raw;arcade=false;patch_formats=.xdelta;ambiguous_formats=;aliases=gamecube,nintendogamecube
wii:.iso;.wbfs;.nkit;.rvz;compress_supported=false;recommended_format=wbfs;arcade=false;patch_formats=.wad;ambiguous_formats=.wad;aliases=nintendowii,wii
wiiu:.wud;.wux;.rpx;compress_supported=false;recommended_format=raw;arcade=false;patch_formats=.wud;.wux;ambiguous_formats=.wud;.wux;aliases=nintendowiiu,wiiu
n3ds:.3ds;.3dz;.cia;compress_supported=false;recommended_format=raw;arcade=false;patch_formats=.cia;.3dsx;ambiguous_formats=.cia;aliases=nintendo3ds,3ds
switch:.xci;.nsp;.nsz;.xcz;compress_supported=false;recommended_format=raw;arcade=false;patch_formats=.nsp;.nsz;.xci;.xcz;ambiguous_formats=.nsp;.nsz;.xci;.xcz;aliases=nintendoswitch,switch
fbneo:.zip;.rom;.bin;compress_supported=true;recommended_format=zip;arcade=true;patch_formats=.ips;.bps;ambiguous_formats=;aliases=finalburn,fbneo
neogeo:.zip;.rom;.bin;compress_supported=true;recommended_format=zip;arcade=true;patch_formats=.ips;.bps;ambiguous_formats=;aliases=neogeo,neo
mame:.zip;.rom;.bin;compress_supported=true;recommended_format=zip;arcade=true;patch_formats=.ips;.bps;ambiguous_formats=

[arcade_rom_suffixes]
.rom;.bin;.chr;.prg;.snd;.vram;.m68k;.z80;.gfx

[media_type_dirs]
rom=rom
covers=covers
screenshots=screenshots
videos=videos
marquees=marquees
miximages=miximages
intro=intro
patcher=patcher

[media_suffix_rules]
covers=.jpg;.jpeg;.png;.webp
screenshots=.jpg;.jpeg;.png;.webp
videos=.mp4;.webm;.mkv;.avi
marquees=.png;.jpg;.jpeg;.webp
miximages=.png;.jpg;.jpeg;.webp
intro=.txt;.md
patcher_generic=.ips;.bps;.ups;.ppf;.xdelta;.xdelta3;.patch;.ips32

[archive_extensions]
.zip;.rar;.7z
